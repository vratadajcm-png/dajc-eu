name: Recover EU Oversize Weekly W39 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-weekly-w39-once.yml'

permissions:
  contents: write

concurrency:
  group: oversize-weekly-publish
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether W39 is still missing
        id: needed
        shell: bash
        run: |
          if [ -f src/content/news/eu-oversize/eu-oversize-weekly-2026-w39.md ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "W39 already exists; recovery generation is not needed."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "W39 is missing; starting safe recovery."
          fi

      - name: Verify publisher secret
        if: steps.needed.outputs.needed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo '::error::OPENAI_API_KEY is missing'; exit 1; }

      - uses: actions/setup-node@v4
        if: steps.needed.outputs.needed == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.needed.outputs.needed == 'true'
        run: npm ci

      - name: Apply W39 editorial limits in runner
        if: steps.needed.outputs.needed == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/lib/quality-gate.mjs')
          s = p.read_text()
          old = 'const MAX_ROUNDUP_REPORTS = 20;'
          assert old in s, 'quality-gate roundup maximum marker not found'
          p.write_text(s.replace(old, 'const MAX_ROUNDUP_REPORTS = 15;', 1))

          p = Path('scripts/lib/openai-client.mjs')
          s = p.read_text()
          replacements = [
              ('10-20 concise verified Rest-of-Europe updates', '10-15 concise verified Rest-of-Europe updates'),
              ('Return at least 10 concise short updates and cover at least 6 distinct countries/territories; 10 reports and 6 jurisdictions are hard publication minimums.', 'Return 10-15 concise short updates and cover at least 6 distinct countries/territories; 10 reports and 6 jurisdictions are hard publication minimums and 15 reports is the maximum.'),
          ]
          for old, new in replacements:
              assert old in s, f'OpenAI editorial marker not found: {old}'
              s = s.replace(old, new, 1)
          p.write_text(s)
          print('Applied W39-only 10-15 Rest of Europe limit; no repository source file is committed by this step.')
          PY

      - name: Refresh monitoring sources
        if: steps.needed.outputs.needed == 'true'
        run: npm run oversize:monitor

      - name: Generate and quality-gate W39
        if: steps.needed.outputs.needed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/run-weekly-publisher.mjs

      - name: Restore runner-only editorial patches before commit
        if: steps.needed.outputs.needed == 'true'
        run: git restore scripts/lib/quality-gate.mjs scripts/lib/openai-client.mjs

      - name: Publish recovered W39
        if: steps.needed.outputs.needed == 'true'
        run: node scripts/publish-gate-commit.mjs

      - name: Confirm W39 committed
        if: steps.needed.outputs.needed == 'true'
        run: |
          git pull --ff-only
          test -f src/content/news/eu-oversize/eu-oversize-weekly-2026-w39.md
          echo 'W39 exists on the updated main checkout.'

      - name: Remove one-off recovery workflow
        if: success()
        shell: bash
        run: |
          git config user.name dajc-bot
          git config user.email bot@users.noreply.github.com
          git pull --ff-only
          git rm .github/workflows/recover-weekly-w39-once.yml
          git commit -m 'chore: remove completed W39 recovery trigger'
          git push
