name: One-time DAJC Social Identity Test (no posts)
on:
  push:
    branches:
      - test/search-claude-e2e-nonpublishing-20261024
    paths:
      - .github/workflows/test-social-identity-once.yml
permissions:
  contents: read
jobs:
  verify-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify company identities without posting
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          DAJC_BUFFER_X_CHANNEL_ID: ${{ vars.DAJC_BUFFER_X_CHANNEL_ID }}
          DAJC_BUFFER_LINKEDIN_CHANNEL_ID: ${{ vars.DAJC_BUFFER_LINKEDIN_CHANNEL_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node scripts/smoke-social-identity.mjs