name: Publish DAJC EU Oversize Weekly on X

# Independent of article generation: the article is publicly released on Friday
# at 12:00 Europe/Prague, and is checked from the live site before an X call.
on:
  schedule:
    - cron: '17 13 * * 5'
      timezone: 'Europe/Prague'
    - cron: '23 17 * * 5'
      timezone: 'Europe/Prague'
    - cron: '37 10 * * 6'
      timezone: 'Europe/Prague'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only: no credentials, costs, posts or ledger writes'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: dajc-x-weekly
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DAJC_X_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preview X announcement (no side effects)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: node scripts/publish-x-weekly.mjs --dry-run
      - name: Refuse live manual posts while feature disabled
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && vars.DAJC_X_ENABLED != 'true' }}
        run: |
          echo '::error::Set repository variable DAJC_X_ENABLED=true after developer-account setup and dry-run validation.'
          exit 1
      - name: Reserve post and verify public site
        id: reserve
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node scripts/publish-x-weekly.mjs --prepare
      - name: Persist reservation before any X API write
        if: ${{ steps.reserve.outputs.send == 'true' }}
        run: |
          git config user.name dajc-bot
          git config user.email bot@users.noreply.github.com
          git add -- data/x-publications.json
          git commit -m 'chore(x): reserve weekly X publication'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish one post via official X API
        if: ${{ steps.reserve.outputs.send == 'true' }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node scripts/publish-x-weekly.mjs --publish
      - name: Record confirmed X post
        if: ${{ steps.reserve.outputs.send == 'true' }}
        run: |
          git add -- data/x-publications.json
          git commit -m 'chore(x): record weekly X publication'
          git pull --rebase origin main
          git push origin HEAD:main
