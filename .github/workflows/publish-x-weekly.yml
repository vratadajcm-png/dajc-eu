name: Publish approved DAJC News to X

# Only approved and live news can be published. The existing X state branch
# provides durable exactly-one-attempt reservations against duplicate posts.
on:
  push:
    branches: [main]
    paths:
      - 'src/content/news/platform/**'
      - 'src/content/news/eu-oversize/**'
  schedule:
    - cron: '17 13 * * *'
      timezone: 'Europe/Prague'
    - cron: '23 18 * * *'
      timezone: 'Europe/Prague'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Prepare preview without API calls, costs or ledger writes'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: dajc-x-weekly
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.DAJC_X_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preview approved news for X
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: node scripts/publish-social-news.mjs x --dry-run
      - name: Require explicit X publishing activation
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && vars.DAJC_X_ENABLED != 'true'
        run: |
          echo '::error::X publication is disabled; verify @DAJCeu account, API permission and budget, then set DAJC_X_ENABLED=true.'
          exit 1
      - name: Load protected X ledger
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        run: node scripts/automation-data.mjs load x
      - name: Verify X account and reserve exactly one live post
        id: reserve
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node scripts/publish-social-news.mjs x --prepare
      - name: Persist reservation before posting
        if: steps.reserve.outputs.send == 'true'
        run: node scripts/automation-data.mjs save x
      - name: Publish from verified company X account
        if: steps.reserve.outputs.send == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node scripts/publish-social-news.mjs x --publish
      - name: Persist confirmed post
        if: steps.reserve.outputs.send == 'true'
        run: node scripts/automation-data.mjs save x
