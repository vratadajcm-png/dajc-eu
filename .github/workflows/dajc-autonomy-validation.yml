name: DAJC autonomy workflow validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-workflow-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate DAJC autonomous workflow expressions and shell
        run: '$(go env GOPATH)/bin/actionlint .github/workflows/dajc-ai-autonomous-claude.yml .github/workflows/dajc-ai-independent-codex-review.yml'
      - name: Reject unsupported Claude beta action arguments (regression guard)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path(".github/workflows/dajc-ai-autonomous-claude.yml").read_text()
          if "anthropics/claude-code-base-action@beta" not in source:
              raise SystemExit("Unexpected Claude action version; re-audit its input contract")
          if re.search(r"(?m)^\s+claude_args:", source):
              raise SystemExit("The selected @beta action ignores claude_args")
          for required in ("model:", "max_turns:", "allowed_tools:"):
              if not re.search(r"(?m)^\s+" + re.escape(required), source):
                  raise SystemExit("Missing required Claude action input: " + required)
          if "claude-sonnet-5-5" not in source:
              raise SystemExit("Missing current supported Claude model default")
          print("Claude beta action input contract verified")
          PY
      - name: Validate JSON review contract
        run: node -e 'const s=require("./.github/ai-autonomy/review-schema.json"); if(!s.properties?.verdict || !s.properties?.findings) process.exit(1)'

  credentials-present:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify both existing API secrets are accessible — no provider requests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Missing OPENAI_API_KEY in this repository"
            exit 1
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Missing ANTHROPIC_API_KEY in this repository"
            exit 1
          fi
          echo "Both required API secret names are configured. No external API was called."
