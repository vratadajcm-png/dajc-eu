name: DAJC autonomy workflow validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-workflow-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate DAJC autonomous workflow expressions and shell
        run: '$(go env GOPATH)/bin/actionlint .github/workflows/dajc-ai-autonomous-claude.yml .github/workflows/dajc-ai-independent-codex-review.yml'
      - name: Validate JSON review contract
        run: node -e 'const s=require("./.github/ai-autonomy/review-schema.json"); if(!s.properties?.verdict || !s.properties?.findings) process.exit(1)'
