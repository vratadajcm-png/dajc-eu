name: Driving Bans Production Acceptance

# Read-only technical HTTP checks, NOT a legal-source sweep.
# No schedule, no secrets, no deployment or production writes.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'scripts/verify-driving-bans-production.mjs'
      - '.github/workflows/driving-bans-production-acceptance.yml'

permissions:
  contents: read

jobs:
  production-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check scripts/verify-driving-bans-production.mjs
      - name: Compare actual public HTTP responses with canonical data
        run: node scripts/verify-driving-bans-production.mjs
      - name: Preserve response and assertion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driving-bans-production-${{ github.sha }}
          path: artifacts/driving-bans-production/
          retention-days: 14
          if-no-files-found: error
