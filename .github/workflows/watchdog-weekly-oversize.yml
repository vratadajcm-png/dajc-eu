name: Watchdog Weekly Oversize Publication

# Recovery-only watchdog. The ONE primary publisher generates through Sonar,
# validates with Claude, opens the protected PR and waits for GitHub checks.
# This watchdog cannot write weekly content or bypass the editorial gate.
on:
  schedule:
    - cron: '47 18 * * 4'
    - cron: '47 4 * * 5'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: write
concurrency:
  group: oversize-weekly-watchdog
  cancel-in-progress: false
jobs:
  watchdog:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check target edition or pending PR
        id: publication
        run: node scripts/check-weekly-publication.mjs
      - name: Dispatch only the primary pipeline
        if: steps.publication.outputs.needed == 'true'
        run: |
          gh workflow run publish-weekly-oversize.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "One primary workflow dispatched. Does not establish successful publication."
      - name: Outcome
        if: always()
        run: |
          echo "No alternate publishing path; source, Claude, CI and live-site checks remain mandatory."
