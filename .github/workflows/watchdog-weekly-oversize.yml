name: Watchdog Weekly Oversize Publication

# Recovery-only watchdog. All content generation, Grok/Claude review, PR
# creation and protected auto-merge happen in the ONE primary publisher.
# This watchdog NEVER creates, modifies, reviews or commits an article.
on:
  schedule:
    - cron: '47 18 * * 4' # Thursday evening, Europe/Prague adjusted seasonally
    - cron: '47 4 * * 5'  # Friday morning before public release
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: oversize-weekly-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect existing edition or pending PR
        id: publication
        run: node scripts/check-weekly-publication.mjs
      - name: Delegate missing edition to the single primary publisher
        if: steps.publication.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-weekly-oversize.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Recovery dispatched to the primary publisher (not itself proof of publication)."
      - name: Watchdog outcome
        if: always()
        run: |
          if [ "${{ steps.publication.outputs.needed }}" = "false" ]; then
            echo "Article exists or final edition PR is awaiting CI/merge; no second publish path."
          else
            echo "The primary workflow must verify sources, pass Grok and Claude, and satisfy GitHub CI before publication."
          fi
