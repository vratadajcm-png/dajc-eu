name: Watchdog Weekly Oversize Publication

# Recovery-only watchdog. The ONE primary publisher researches with Perplexity Search,
# validates with Claude, opens the protected PR and waits for GitHub checks.
# This watchdog cannot write weekly content or bypass the editorial gate.
on:
  schedule:
    - cron: '47 18 * * 4'
    - cron: '47 4 * * 5'
    # After the Friday 12:00 Europe/Prague slot (13:37 CEST / 12:37 CET) and on
    # Saturday: an edition PR still waiting for review means the site shows
    # nothing for the week (W43 waited nine days without an alert).
    - cron: '37 11 * * 5'
    - cron: '37 8 * * 6'
    - cron: '37 7 * * 0-4' # detect missing current editions throughout the week
  workflow_dispatch:
    inputs:
      target_week:
        description: 'Optional explicit edition to verify; default is the latest due Friday edition.'
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
  actions: write
  deployments: read
  checks: read
  statuses: read
  issues: write
concurrency:
  group: oversize-weekly-watchdog
  cancel-in-progress: false
jobs:
  watchdog:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check upcoming preparation or pending PR
        id: publication
        env:
          OVERSIZE_TARGET_WEEK: ${{ inputs.target_week || '' }}
        run: node scripts/check-weekly-publication.mjs
      - name: Determine preparation window
        id: window
        env:
          EXPLICIT_WEEK: ${{ inputs.target_week || '' }}
        run: |
          weekday=$(TZ=Europe/Prague date +%u)
          if [ -n "$EXPLICIT_WEEK" ] || { [ "$weekday" -ge 4 ] && [ "$weekday" -le 6 ]; }; then
            echo "prepare=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepare=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch only the primary pipeline
        if: steps.publication.outputs.needed == 'true' && steps.window.outputs.prepare == 'true'
        env:
          TARGET_WEEK: ${{ steps.publication.outputs.week }}
        run: |
          gh workflow run publish-weekly-oversize.yml --repo "$GITHUB_REPOSITORY" --ref main -f "target_week=$TARGET_WEEK"
          echo "One primary workflow dispatched. Does not establish successful publication."
      - name: Verify latest due edition on production independently
        id: verification
        timeout-minutes: 12
        env:
          OVERSIZE_TARGET_WEEK: ${{ inputs.target_week || '' }}
        run: node scripts/verify-weekly-publication.mjs
      - name: Verify prepared edition stays hidden until its slot
        if: always() && steps.publication.outputs.article_exists == 'true' && steps.publication.outputs.public_due != 'true'
        timeout-minutes: 12
        env:
          TARGET_WEEK: ${{ steps.publication.outputs.week }}
        run: node scripts/verify-weekly-publication.mjs
      - name: Alert on an overdue edition or open PRs of past weeks
        if: steps.publication.outputs.overdue == 'true' || steps.publication.outputs.stale_prs != ''
        env:
          OVERDUE: ${{ steps.publication.outputs.overdue }}
          STALE_PRS: ${{ steps.publication.outputs.stale_prs }}
        run: |
          if [ "$OVERDUE" = "true" ]; then
            echo "::error::The ${{ steps.publication.outputs.week }} edition is past its Friday 12:00 Europe/Prague slot and its PR is not merged. Review and merge it, or close it if the edition is withdrawn."
          fi
          for pr in $STALE_PRS; do
            echo "::error::Edition PR for a week that has already passed is still open: $pr - close it or merge it as a correction."
          done
          exit 1
      - name: Report blocked publication
        if: failure()
        env:
          TARGET_WEEK: ${{ steps.verification.outputs.week || inputs.target_week || '' }}
        run: node scripts/report-weekly-failure.mjs
      - name: Outcome
        if: always()
        run: |
          echo "No alternate publishing path; source, Claude, CI and live-site checks remain mandatory."
