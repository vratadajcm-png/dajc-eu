name: Watchdog Weekly Oversize Publication

# Independent safety net for the EU Oversize Weekly, separate from
# publish-weekly-oversize.yml in case one workflow's schedule is dropped.
# The article is prepared on Thursday and released by the site at Friday
# 12:00 Europe/Prague (see publish-weekly-oversize.yml), so the watchdog
# checks on Thursday evening and early Friday - both leave room for GitHub's
# multi-hour schedule delays before the release. It only performs
# publication work when the target week's article is still missing.

on:
  schedule:
    - cron: '47 18 * * 4' # Thursday 20:47 CEST / 19:47 CET
    - cron: '47 4 * * 5'  # Friday 06:47 CEST / 05:47 CET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oversize-weekly-publish
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether watchdog may run
        id: gate
        shell: bash
        run: |
          # Every trigger may run: check-weekly-publication.mjs below keeps
          # the watchdog a no-op once the target article exists.
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Europe/Prague local time: $(TZ=Europe/Prague date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Checkout
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Check whether target week is already published
        if: steps.gate.outputs.should_run == 'true'
        id: publish-needed
        run: node scripts/check-weekly-publication.mjs

      - name: Apply DAJC editorial policy
        if: steps.gate.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        run: node scripts/apply-weekly-editorial-policy.mjs

      - name: Pre-flight - verify OPENAI_API_KEY is configured
        if: steps.gate.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY repository secret is not set."
            exit 1
          fi
          echo "Pre-flight OK: OPENAI_API_KEY is configured (value not printed)."

      - name: Setup Node
        if: steps.gate.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        run: npm ci

      - name: Final data refresh
        if: steps.gate.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        run: npm run oversize:monitor

      - name: Generate weekly article
        if: steps.gate.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/run-weekly-publisher.mjs

      - name: Commit new article and refreshed data
        if: steps.gate.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        run: node scripts/publish-gate-commit.mjs

      - name: Watchdog outcome
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.gate.outputs.should_run }}" != "true" ]; then
            echo "Outcome: watchdog intentionally inactive for this trigger."
          elif [ "${{ steps.publish-needed.outputs.needed }}" = "false" ]; then
            echo "Outcome: target weekly article already exists; no action needed."
          elif [ "${{ job.status }}" = "success" ]; then
            echo "Outcome: watchdog recovered the missing weekly publication successfully."
          else
            echo "Outcome: watchdog recovery failed; inspect the failed step above."
            exit 1
          fi
