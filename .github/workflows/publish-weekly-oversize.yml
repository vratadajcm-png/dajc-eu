name: Publish Weekly Oversize Article

# Publishes during the 08:00-13:59 Europe/Prague window every Friday.
# GitHub Actions cron is UTC-only, so the workflow keeps the two existing
# near-noon triggers (10:00 and 11:00 UTC) that cover CET/CEST. The first
# step accepts either trigger, including a moderate GitHub scheduling delay,
# as long as the job actually starts inside the local publication window.
# The article path is week-specific and the generator refuses to overwrite
# it, so a second accepted trigger is an idempotent no-op rather than a
# duplicate publication. workflow_dispatch always runs regardless of the
# time check, for manual/testing runs.
#
# IMPORTANT - scheduled trigger timing is best-effort, not exact: GitHub
# documents that scheduled workflows can be delayed, sometimes by several
# minutes, during periods of high load on GitHub's infrastructure. A delay
# that pushes both triggers outside 08:00-13:59 local time still skips that
# week's automatic publication. If a Friday publish appears to have been
# silently skipped,
# check the Actions run history and use workflow_dispatch to publish it
# manually - manual runs always skip the time gate entirely, see below.

on:
  schedule:
    - cron: '0 10 * * 5'
    - cron: '0 11 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: generate, verify and build the article (using the real OpenAI API if configured) but do not commit, push, or change published content.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: oversize-weekly-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check Europe/Prague local time
        id: check-time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run (workflow_dispatch) - skipping the time gate."
            exit 0
          fi
          hour=$(TZ=Europe/Prague date +%H)
          hour_number=$((10#$hour))
          echo "Current Europe/Prague hour: $hour"
          if [ "$hour_number" -ge 8 ] && [ "$hour_number" -le 13 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Inside the Europe/Prague publication window (08:00-13:59)."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Outside the Europe/Prague publication window (got $hour, require 08:00-13:59) - exiting quietly."
          fi

      # For workflow_dispatch, honors the `dry_run` checkbox. For the real
      # Friday `schedule` trigger, always resolves to false.
      - name: Determine dry-run mode
        id: dry-run-mode
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      # Fails fast, before checkout/install/data-refresh spend any time or
      # bandwidth, if OPENAI_API_KEY is missing - a real run without it is a
      # configuration error (see generate-weekly-article.mjs's own preflight
      # for the same check, kept as defense in depth for direct/local
      # invocations that bypass this workflow). Never echoes the value.
      - name: Pre-flight - verify OPENAI_API_KEY is configured
        if: steps.check-time.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY repository secret is not set (Settings -> Secrets and variables -> Actions -> New repository secret). Failing before any work is done - see docs/NEWS_AUTOMATION.md#github-secrets."
            {
              echo "### EU Oversize Weekly - pre-flight failed"
              echo ""
              echo "\`OPENAI_API_KEY\` is not configured. No data was refreshed, no article was generated, nothing was committed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Pre-flight OK: OPENAI_API_KEY is configured (value not printed)."

      - name: Checkout
        if: steps.check-time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.check-time.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.check-time.outputs.should_run == 'true'
        run: npm ci

      - name: Final data refresh
        if: steps.check-time.outputs.should_run == 'true'
        run: npm run oversize:monitor

      - name: Generate weekly article (official driving-ban calendars, verification, quality gate, and build check all happen inside this script)
        if: steps.check-time.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run oversize:publish -- ${{ steps.dry-run-mode.outputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit new article and refreshed data (explicit publish gate - only if something was actually written)
        # Skipped entirely for dry runs as a second, belt-and-suspenders
        # guard - the script itself never leaves a dry-run file on disk
        # (see generate-weekly-article.mjs's --dry-run handling), so this
        # `if` is defensive, not load-bearing. Also implicitly skipped if
        # the previous step failed (its `if` has no failure()/always(), so
        # GitHub Actions ANDs it with success()) - a hard preflight/quality-
        # gate/build failure never reaches this step.
        #
        # The actual publish/data-only decision lives in
        # scripts/publish-gate-commit.mjs (decidePublishCommit in
        # scripts/lib/publish-gate.mjs, unit tested) rather than here, so a
        # data/oversize-only refresh can never again be committed with a
        # "content: publish..." message - see docs/NEWS_AUTOMATION.md.
        if: steps.check-time.outputs.should_run == 'true' && steps.dry-run-mode.outputs.dry_run != 'true'
        run: node scripts/publish-gate-commit.mjs
