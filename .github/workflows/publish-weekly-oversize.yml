name: Publish Weekly Oversize Article

# Targets 12:00 Europe/Prague every Friday. GitHub Actions cron is UTC-only
# and cannot express "12:00 in a DST-observing timezone" as a single
# expression (Prague is UTC+1 in winter / CET and UTC+2 in summer / CEST),
# so this workflow fires at BOTH UTC times that noon-Prague can fall on
# (10:00 UTC covers CEST, 11:00 UTC covers CET) and the first step checks
# the actual Europe/Prague wall-clock time, only letting the rest of the
# job run on the correct one. The other trigger that week is a harmless
# no-op. workflow_dispatch always runs regardless of the time check, for
# manual/testing runs.
#
# IMPORTANT - scheduled trigger timing is best-effort, not exact: GitHub
# documents that scheduled workflows can be delayed, sometimes by several
# minutes, during periods of high load on GitHub's infrastructure. The
# check-time step below only matches the exact target HOUR (12) in
# Europe/Prague, not a wider window, to avoid double-firing on the same
# Friday - so a delay severe enough to push the correct-season trigger past
# 12:59 local time would cause that week's automatic publish to be skipped
# entirely (the other, wrong-season cron already fired and no-op'd earlier
# that day). If a Friday publish appears to have been silently skipped,
# check the Actions run history and use workflow_dispatch to publish it
# manually - manual runs always skip the time gate entirely, see below.
#
# ============================= TEMPORARY =====================================
# The `push` trigger below (and everything that references
# `github.event_name == 'push'`) exists ONLY so this workflow's
# workflow_dispatch UI becomes usable while it lives on a feature branch -
# GitHub does not expose workflow_dispatch for a workflow that doesn't also
# exist on the repository's default branch yet. A run triggered this way is
# forced into dry_run mode unconditionally (see "Determine dry-run mode"
# below) and is additionally blocked from the commit/push step by its own
# explicit `github.event_name != 'push'` guard, on top of the normal
# dry-run guard - two independent reasons a push-triggered run can never
# publish anything.
# REMOVE the `push:` block below (and the two `github.event_name == 'push'`
# references further down) once this branch has been tested and merged to
# main and workflow_dispatch is reachable normally from there.
# ==============================================================================

on:
  push:
    branches:
      - feature/news-automation
  schedule:
    - cron: '0 10 * * 5'
    - cron: '0 11 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: generate, verify and build the article (using the real OpenAI API if configured) but do not commit, push, or change published content.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: oversize-weekly-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check Europe/Prague local time
        id: check-time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual/test run (${{ github.event_name }}) - skipping the time gate."
            exit 0
          fi
          hour=$(TZ=Europe/Prague date +%H)
          echo "Current Europe/Prague hour: $hour"
          if [ "$hour" = "12" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Not the target hour in Europe/Prague (got $hour, want 12) - this is the redundant DST-safety trigger, exiting quietly."
          fi

      # TEMPORARY (see the top-of-file note): forces dry_run=true for any
      # run triggered by the temporary `push` trigger, regardless of any
      # other input. For workflow_dispatch, honors the `dry_run` checkbox.
      # For the real Friday `schedule` trigger, always resolves to false.
      - name: Determine dry-run mode
        id: dry-run-mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "Triggered by push to feature/news-automation (TEMPORARY test trigger) - forcing dry_run=true."
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check-time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.check-time.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.check-time.outputs.should_run == 'true'
        run: npm ci

      - name: Final data refresh
        if: steps.check-time.outputs.should_run == 'true'
        run: npm run oversize:monitor

      - name: Generate weekly article (verification + quality gate + build check happen inside this script)
        if: steps.check-time.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run oversize:publish -- ${{ steps.dry-run-mode.outputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit new article and refreshed data (only if something was actually written)
        # Three independent, redundant guards, all must hold for this step
        # to run at all:
        #  1. steps.dry-run-mode.outputs.dry_run != 'true' - normal dry-run guard.
        #  2. github.event_name != 'push' - explicit extra guard for the
        #     TEMPORARY push trigger (see top-of-file note): even if (1) had
        #     a bug, a push-triggered run still could not reach this step.
        #  3. Even if this step somehow ran anyway, the script itself never
        #     leaves a dry-run file on disk (see generate-weekly-article.mjs),
        #     so `git diff --cached` below would still find nothing to commit.
        if: steps.check-time.outputs.should_run == 'true' && steps.dry-run-mode.outputs.dry_run != 'true' && github.event_name != 'push'
        run: |
          git config user.name "dajc-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/oversize src/content/news/eu-oversize
          if git diff --cached --quiet; then
            echo "Nothing to publish this run (no article was generated, or no data changed) - not an error, see the previous step's log for why."
          else
            week=$(TZ=Europe/Prague date +%G-W%V)
            git commit -m "content: publish EU Oversize Weekly ${week}"
            git push
          fi
