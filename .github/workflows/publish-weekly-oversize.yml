name: Publish Weekly Oversize Article

# The article is PREPARED on Thursday and RELEASED on Friday at 12:00
# Europe/Prague by the site itself: the generator writes that instant into
# `publishedAt`, and the on-demand news pages only show an article once
# `publishedAt` has passed (src/config/news.ts isNewsEntryPublic). Nothing has
# to run at 12:00.
#
# Why: GitHub delivers scheduled runs of this repository hours late (about
# four hours since late August 2026), which made every Friday-noon cron -
# primary, recovery and watchdog alike - fire in the afternoon. Preparing a
# day ahead absorbs that delay and leaves time to react when the quality gate
# rejects an edition.
#
# Every trigger is idempotent (scripts/check-weekly-publication.mjs), so the
# later ones only do work while the target article is still missing. Minutes
# are off the top of the hour, where GitHub's scheduler is least congested.
# Friday/Saturday recoveries publish an article whose slot is already past,
# i.e. immediately on deploy.

on:
  schedule:
    - cron: '17 3 * * 4'  # Thursday 05:17 CEST / 04:17 CET - preparation
    - cron: '17 9 * * 4'  # Thursday retry
    - cron: '17 15 * * 4' # Thursday retry
    - cron: '17 3 * * 5'  # Friday early retry, still ahead of 12:00 even if delayed
    - cron: '17 10 * * 5' # Friday recovery (published immediately)
    - cron: '17 6 * * 6'  # Saturday catch-up
  workflow_dispatch:
    inputs:
      search_claude:
        description: 'Use verified Perplexity Search and Claude for this one manual regeneration; leave permanent activation unchanged.'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: generate, verify and build the article but do not commit/push.'
        type: boolean
        default: false
      preview:
        description: 'Publish a separate preview article using Friday quality gates; never consumes the final weekly slug.'
        type: boolean
        default: false
      correction:
        description: 'Regenerate the current target edition from source data; replaces an existing article only if the new edition passes every gate and the build (stamps updatedAt).'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: oversize-weekly-publish
  # Let an in-flight primary publication finish. Later recovery schedules wait
  # and then become cheap idempotent no-ops once the target article exists.
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DAJC_AUTONOMOUS_WEEKLY: ${{ (vars.DAJC_SONAR_ENABLED == 'true' || vars.DAJC_SEARCH_CLAUDE_ENABLED == 'true') && '1' || '0' }}
      DAJC_SONAR_ENABLED: ${{ vars.DAJC_SONAR_ENABLED }}
      DAJC_SEARCH_CLAUDE_ENABLED: ${{ github.event.inputs.search_claude == 'true' && 'true' || vars.DAJC_SEARCH_CLAUDE_ENABLED }}
      OVERSIZE_PREVIEW: ${{ github.event.inputs.preview == 'true' && '1' || '' }}
      OVERSIZE_CORRECTION: ${{ github.event.inputs.correction == 'true' && '1' || '' }}
    steps:
      - name: Resolve scheduled trigger
        id: trigger
        shell: bash
        run: |
          event="${{ github.event_name }}"
          schedule="${{ github.event.schedule }}"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

          if [ "$event" = "workflow_dispatch" ]; then
            echo "role=manual" >> "$GITHUB_OUTPUT"
            echo "preview=${{ github.event.inputs.preview == 'true' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
            echo "Manual run - publication pipeline enabled."
            exit 0
          fi

          echo "preview=false" >> "$GITHUB_OUTPUT"
          echo "Scheduled cron identity: $schedule"
          echo "Europe/Prague time at execution: $(TZ=Europe/Prague date '+%a %Y-%m-%d %H:%M %Z')"
          case "$schedule" in
            '17 3 * * 4') role=thursday-prepare ;;
            *' * * 4') role=thursday-retry ;;
            '17 3 * * 5') role=friday-early-retry ;;
            *' * * 5') role=friday-recovery ;;
            *) role=saturday-catch-up ;;
          esac
          echo "role=$role" >> "$GITHUB_OUTPUT"
          echo "Trigger role: $role - publication work happens only if the target article is missing."

      - name: Checkout
        if: steps.trigger.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Check whether target week is already published
        if: steps.trigger.outputs.should_run == 'true'
        id: publish-needed
        env:
          OVERSIZE_CORRECTION: ${{ github.event.inputs.correction == 'true' && '1' || '' }}
        run: node scripts/check-weekly-publication.mjs

      - name: Determine dry-run mode
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        id: dry-run-mode
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-flight - check Perplexity and Claude API credentials
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          selected="$OPENAI_API_KEY"
          if [ "$DAJC_SONAR_ENABLED" = "true" ] || [ "$DAJC_SEARCH_CLAUDE_ENABLED" = "true" ]; then selected="$PERPLEXITY_API_KEY"; fi
          if [ -z "$selected" ]; then
            echo "::error::The selected publisher API key is missing. No article will be generated."
            exit 1
          fi
          if { [ "$DAJC_SONAR_ENABLED" = "true" ] || [ "$DAJC_SEARCH_CLAUDE_ENABLED" = "true" ]; } && [ "${{ github.event.inputs.dry_run }}" != "true" ] && [ "${{ github.event.inputs.preview }}" != "true" ] && [ "${{ github.event.inputs.correction }}" != "true" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY missing. Autonomous release blocked before paid research."
            exit 1
          fi
          echo "Required research/editor credentials present (values never printed)."

      - name: Setup Node
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        run: npm ci

      - name: Load latest monitoring data
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        run: node scripts/automation-data.mjs load findings

      - name: Final data refresh
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-sonnet-5-5' }}
        run: npm run oversize:monitor

      - name: Generate weekly article
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-sonnet-5-5' }}
        # One generation attempt. Quality > count: an edition contains exactly
        # the items that pass every editorial rule, so there is nothing to
        # retry for (no lead/Rest-of-Europe minimum, no padding loop).
        run: node scripts/generate-weekly-article.mjs ${{ steps.dry-run-mode.outputs.dry_run == 'true' && '--dry-run' || '' }} ${{ steps.trigger.outputs.preview == 'true' && '--preview' || '' }} ${{ github.event.inputs.correction == 'true' && '--correction' || '' }}

      - name: Claude final editorial approval for Sonar article
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true' && steps.dry-run-mode.outputs.dry_run != 'true' && steps.trigger.outputs.preview != 'true' && github.event.inputs.correction != 'true' && (vars.DAJC_SONAR_ENABLED == 'true' || vars.DAJC_SEARCH_CLAUDE_ENABLED == 'true' || github.event.inputs.search_claude == 'true')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-sonnet-5-5' }}
        run: |
          target="${{ steps.publish-needed.outputs.target }}"
          if [ -f "$target" ]; then
            node scripts/claude-weekly-review.mjs "$target"
          else
            echo "::warning::No qualified article generated this week; no approval or publication."
          fi

      - name: Open reviewed publication PR or persist data-only refresh
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true' && steps.dry-run-mode.outputs.dry_run != 'true'
        run: node scripts/publish-gate-commit.mjs

      # A week where nothing qualifies exits the generator with success, so
      # without this step a missing edition would stay silent. Thursday runs
      # only warn (later retries refresh the data and try again); from the
      # Friday-early retry on - and on manual runs - a still-missing edition
      # fails the run so GitHub e-mails the owner before the 12:00 release.
      - name: Alert when no edition was produced
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true' && steps.dry-run-mode.outputs.dry_run != 'true' && steps.trigger.outputs.preview != 'true'
        shell: bash
        run: |
          target="${{ steps.publish-needed.outputs.target }}"
          if [ -f "$target" ]; then
            echo "Edition present: $target"
            exit 0
          fi
          msg="No EU Oversize Weekly edition for ${{ steps.publish-needed.outputs.week }}: nothing passed the editorial rules (see the generator log above)."
          case "${{ steps.trigger.outputs.role }}" in
            thursday-*) echo "::warning::$msg Later retries will try again with refreshed data." ;;
            *) echo "::error::$msg"; exit 1 ;;
          esac

      - name: Publication outcome
        if: always()
        run: |
          echo "Trigger role: ${{ steps.trigger.outputs.role || 'unknown' }}"
          echo "Preview: ${{ steps.trigger.outputs.preview || 'false' }}"
          if [ "${{ steps.trigger.outputs.should_run }}" != "true" ]; then
            echo "Outcome: intentional no-op."
          elif [ "${{ steps.publish-needed.outputs.needed }}" = "false" ]; then
            echo "Outcome: article already exists or its PR awaits review; no generation repeated."
          elif [ "${{ job.status }}" = "success" ]; then
            echo "Outcome: preparation completed. Claude-approved final article can auto-merge only through protected GitHub CI."
          else
            echo "Outcome: publication pipeline failed; inspect the failed step above."
          fi
