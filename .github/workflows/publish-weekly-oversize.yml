name: Publish Weekly Oversize Article

# Friday publication is scheduled at both UTC instants that can represent
# 12:00 Europe/Prague (10:00 UTC in CEST, 11:00 UTC in CET). Later Friday
# triggers are recovery checks: the publication check is idempotent, so they
# only do real work when the target article is still missing. A Saturday
# catch-up remains as the final safety net.
#
# TEMPORARY 2026-08-31 preview hook: the merge commit for PR #7 triggers one
# preview publication so DAJC can inspect Friday's exact format today. The
# preview uses a separate slug and therefore cannot consume Friday's final W37
# slug. The bot's preview commit does not match the merge-message gate, so this
# cannot loop.

on:
  schedule:
    - cron: '0 10 * * 5' # Friday 12:00 CEST (primary in summer)
    - cron: '0 11 * * 5' # Friday 12:00 CET; summer recovery check
    - cron: '0 12 * * 5' # Friday last-chance recovery check
    - cron: '0 6 * * 6'  # Saturday catch-up if Friday did not publish
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: generate, verify and build the article but do not commit/push.'
        type: boolean
        default: false
      preview:
        description: 'Publish a separate preview article using Friday quality gates; never consumes the final weekly slug.'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: oversize-weekly-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve scheduled trigger
        id: trigger
        shell: bash
        run: |
          event="${{ github.event_name }}"
          schedule="${{ github.event.schedule }}"
          message="${{ github.event.head_commit.message }}"

          if [ "$event" = "push" ]; then
            if [[ "$message" == *"Recover missing DAJC Weekly publication 2026-09-04"* ]]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "role=one-time-recovery" >> "$GITHUB_OUTPUT"
              echo "preview=false" >> "$GITHUB_OUTPUT"
              echo "Recovery commit detected - publishing the missing Friday weekly article."
            elif [[ "$message" == *"Unify DAJC Weekly at 20 leads + 10-by-6 Europe roundup"* ]]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "role=one-time-preview" >> "$GITHUB_OUTPUT"
              echo "preview=true" >> "$GITHUB_OUTPUT"
              echo "PR #7 merge detected - publishing one-time W37 preview."
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "role=ordinary-push" >> "$GITHUB_OUTPUT"
              echo "preview=false" >> "$GITHUB_OUTPUT"
              echo "Ordinary main push - weekly publication not requested."
            fi
            exit 0
          fi

          if [ "$event" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "role=manual" >> "$GITHUB_OUTPUT"
            echo "preview=${{ github.event.inputs.preview == 'true' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
            echo "Manual run - publication pipeline enabled."
            exit 0
          fi

          echo "preview=false" >> "$GITHUB_OUTPUT"
          if [ "$schedule" = "0 6 * * 6" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "role=catch-up" >> "$GITHUB_OUTPUT"
            echo "Saturday catch-up trigger - publication pipeline enabled if the target article is still missing."
            exit 0
          fi

          offset=$(TZ=Europe/Prague date +%z)
          echo "Europe/Prague UTC offset at execution: $offset"
          echo "Scheduled cron identity: $schedule"

          if { [ "$offset" = "+0200" ] && [ "$schedule" = "0 10 * * 5" ]; } || { [ "$offset" = "+0100" ] && [ "$schedule" = "0 11 * * 5" ]; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "role=friday-primary" >> "$GITHUB_OUTPUT"
            echo "Correct CET/CEST Friday trigger selected. Runner delay does not matter."
          elif [ "$offset" = "+0200" ] && [ "$schedule" = "0 11 * * 5" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "role=friday-recovery" >> "$GITHUB_OUTPUT"
            echo "Summer fallback trigger - publish only if the primary run did not create the target article."
          elif [ "$schedule" = "0 12 * * 5" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "role=friday-last-chance" >> "$GITHUB_OUTPUT"
            echo "Friday last-chance trigger - publish only if the target article is still missing."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "role=friday-redundant" >> "$GITHUB_OUTPUT"
            echo "Early/redundant DST-safety Friday trigger - no publication work required."
          fi

      - name: Checkout
        if: steps.trigger.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Check whether target week is already published
        if: steps.trigger.outputs.should_run == 'true'
        id: publish-needed
        run: node scripts/check-weekly-publication.mjs

      - name: Determine dry-run mode
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        id: dry-run-mode
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-flight - verify OPENAI_API_KEY is configured
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY repository secret is not set."
            exit 1
          fi
          echo "Pre-flight OK: OPENAI_API_KEY is configured (value not printed)."

      - name: Setup Node
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        run: npm ci

      - name: Final data refresh
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        run: npm run oversize:monitor

      - name: Generate weekly article
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/run-weekly-publisher.mjs ${{ steps.dry-run-mode.outputs.dry_run == 'true' && '--dry-run' || '' }} ${{ steps.trigger.outputs.preview == 'true' && '--preview' || '' }}

      - name: Commit new article and refreshed data
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true' && steps.dry-run-mode.outputs.dry_run != 'true'
        run: node scripts/publish-gate-commit.mjs

      - name: Publication outcome
        if: always()
        run: |
          echo "Trigger role: ${{ steps.trigger.outputs.role || 'unknown' }}"
          echo "Preview: ${{ steps.trigger.outputs.preview || 'false' }}"
          if [ "${{ steps.trigger.outputs.should_run }}" != "true" ]; then
            echo "Outcome: intentional no-op."
          elif [ "${{ steps.publish-needed.outputs.needed }}" = "false" ]; then
            echo "Outcome: target article already exists; idempotent no-op."
          elif [ "${{ job.status }}" = "success" ]; then
            echo "Outcome: publication/dry-run pipeline completed successfully."
          else
            echo "Outcome: publication pipeline failed; inspect the failed step above."
          fi
