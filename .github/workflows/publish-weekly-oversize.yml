name: Publish Weekly Oversize Article

# Targets 12:00 Europe/Prague every Friday. GitHub Actions cron is UTC-only
# and cannot express "12:00 in a DST-observing timezone" as a single
# expression (Prague is UTC+1 in winter / CET and UTC+2 in summer / CEST),
# so this workflow fires at BOTH UTC times that noon-Prague can fall on
# (10:00 UTC covers CEST, 11:00 UTC covers CET) and the first step checks
# the actual Europe/Prague wall-clock time, only letting the rest of the
# job run on the correct one. The other trigger that week is a harmless
# no-op. workflow_dispatch always runs regardless of the time check, for
# manual/testing runs.
#
# IMPORTANT - scheduled trigger timing is best-effort, not exact: GitHub
# documents that scheduled workflows can be delayed, sometimes by several
# minutes, during periods of high load on GitHub's infrastructure. The
# check-time step below only matches the exact target HOUR (12) in
# Europe/Prague, not a wider window, to avoid double-firing on the same
# Friday - so a delay severe enough to push the correct-season trigger past
# 12:59 local time would cause that week's automatic publish to be skipped
# entirely (the other, wrong-season cron already fired and no-op'd earlier
# that day). If a Friday publish appears to have been silently skipped,
# check the Actions run history and use workflow_dispatch to publish it
# manually - manual runs always skip the time gate entirely, see below.

on:
  schedule:
    - cron: '0 10 * * 5'
    - cron: '0 11 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: generate, verify and build the article (using the real OpenAI API if configured) but do not commit, push, or change published content.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: oversize-weekly-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check Europe/Prague local time
        id: check-time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run (workflow_dispatch) - skipping the time gate."
            exit 0
          fi
          hour=$(TZ=Europe/Prague date +%H)
          echo "Current Europe/Prague hour: $hour"
          if [ "$hour" = "12" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Not the target hour in Europe/Prague (got $hour, want 12) - this is the redundant DST-safety trigger, exiting quietly."
          fi

      # For workflow_dispatch, honors the `dry_run` checkbox. For the real
      # Friday `schedule` trigger, always resolves to false.
      - name: Determine dry-run mode
        id: dry-run-mode
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check-time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.check-time.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.check-time.outputs.should_run == 'true'
        run: npm ci

      - name: Final data refresh
        if: steps.check-time.outputs.should_run == 'true'
        run: npm run oversize:monitor

      - name: Generate weekly article (verification + quality gate + build check happen inside this script)
        if: steps.check-time.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run oversize:publish -- ${{ steps.dry-run-mode.outputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit new article and refreshed data (only if something was actually written)
        # Skipped entirely for dry runs as a second, belt-and-suspenders
        # guard - the script itself never leaves a dry-run file on disk
        # (see generate-weekly-article.mjs's --dry-run handling), so this
        # `if` is defensive, not load-bearing.
        if: steps.check-time.outputs.should_run == 'true' && steps.dry-run-mode.outputs.dry_run != 'true'
        run: |
          git config user.name "dajc-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/oversize src/content/news/eu-oversize
          if git diff --cached --quiet; then
            echo "Nothing to publish this run (no article was generated, or no data changed) - not an error, see the previous step's log for why."
          else
            week=$(TZ=Europe/Prague date +%G-W%V)
            git commit -m "content: publish EU Oversize Weekly ${week}"
            git push
          fi
