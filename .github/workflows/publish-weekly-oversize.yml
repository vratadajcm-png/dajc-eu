name: Publish Weekly Oversize Article

# The article is PREPARED on Thursday and RELEASED on Friday at 12:00
# Europe/Prague by the site itself: the generator writes that instant into
# `publishedAt`, and the on-demand news pages only show an article once
# `publishedAt` has passed (src/config/news.ts isNewsEntryPublic). Nothing has
# to run at 12:00.
#
# Why: GitHub delivers scheduled runs of this repository hours late (about
# four hours since late August 2026), which made every Friday-noon cron -
# primary, recovery and watchdog alike - fire in the afternoon. Preparing a
# day ahead absorbs that delay and leaves time to react when the quality gate
# rejects an edition.
#
# Every trigger is idempotent (scripts/check-weekly-publication.mjs), so the
# later ones only do work while the target article is still missing. Minutes
# are off the top of the hour, where GitHub's scheduler is least congested.
# Friday/Saturday recoveries publish an article whose slot is already past,
# i.e. immediately on deploy.

on:
  schedule:
    - cron: '17 3 * * 4'  # Thursday 05:17 CEST / 04:17 CET - preparation
    - cron: '17 9 * * 4'  # Thursday retry
    - cron: '17 15 * * 4' # Thursday retry
    - cron: '17 3 * * 5'  # Friday early retry, still ahead of 12:00 even if delayed
    - cron: '17 10 * * 5' # Friday recovery (published immediately)
    - cron: '17 6 * * 6'  # Saturday catch-up
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Full live simulation: generate, build, independently review and repair in the disposable runner; never commit/push.'
        type: boolean
        default: false
      force_refresh:
        description: 'Force fresh paid source discovery despite a successful refresh in the last 18 hours.'
        type: boolean
        default: false
      preview:
        description: 'Publish a separate preview article using Friday quality gates; never consumes the final weekly slug.'
        type: boolean
        default: false
      target_week:
        description: 'Optional explicit ISO edition, e.g. 2026-W47. Late release retains its original scheduled slot.'
        type: string
        default: ''
      correction:
        description: 'Regenerate the current target edition from source data; replaces an existing article only if the new edition passes every gate and the build (stamps updatedAt).'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  # Lets the release step read the PR's required checks.
  checks: read
  statuses: read
  deployments: read
  issues: write

concurrency:
  group: oversize-data
  # Let an in-flight primary publication finish. Later recovery schedules wait
  # and then become cheap idempotent no-ops once the target article exists.
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Research is Perplexity Search + Claude; writing is Claude. OpenAI is
      # not used. The final edition publishes autonomously (owner decision,
      # 24 October 2026): once Claude approves it source by source and the
      # required checks pass, the release step merges it, and the site shows
      # it from Friday 12:00 Europe/Prague. Set the repository variable
      # DAJC_WEEKLY_AUTO_MERGE=false to require a human merge again.
      DAJC_AUTONOMOUS_WEEKLY: ${{ vars.DAJC_WEEKLY_AUTO_MERGE != 'false' && '1' || '0' }}
      OVERSIZE_PREVIEW: ${{ github.event.inputs.preview == 'true' && '1' || '' }}
      OVERSIZE_CORRECTION: ${{ github.event.inputs.correction == 'true' && '1' || '' }}
      OVERSIZE_RECOVERY_ALLOWED: '1'
      OVERSIZE_TARGET_WEEK: ${{ inputs.target_week || '' }}
    steps:
      - name: Resolve scheduled trigger
        id: trigger
        shell: bash
        run: |
          event="${{ github.event_name }}"
          schedule="${{ github.event.schedule }}"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

          if [ "$event" = "workflow_dispatch" ]; then
            echo "role=manual" >> "$GITHUB_OUTPUT"
            echo "preview=${{ github.event.inputs.preview == 'true' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
            echo "Manual run - publication pipeline enabled."
            exit 0
          fi

          echo "preview=false" >> "$GITHUB_OUTPUT"
          echo "Scheduled cron identity: $schedule"
          echo "Europe/Prague time at execution: $(TZ=Europe/Prague date '+%a %Y-%m-%d %H:%M %Z')"
          case "$schedule" in
            '17 3 * * 4') role=thursday-prepare ;;
            *' * * 4') role=thursday-retry ;;
            '17 3 * * 5') role=friday-early-retry ;;
            *' * * 5') role=friday-recovery ;;
            *) role=saturday-catch-up ;;
          esac
          echo "role=$role" >> "$GITHUB_OUTPUT"
          echo "Trigger role: $role - publication work happens only if the target article is missing."

      - name: Checkout
        if: steps.trigger.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether target week is already published
        if: steps.trigger.outputs.should_run == 'true'
        id: publish-needed
        env:
          OVERSIZE_CORRECTION: ${{ github.event.inputs.correction == 'true' && '1' || '' }}
        run: node scripts/check-weekly-publication.mjs

      - name: Pin edition identity for every downstream gate
        if: steps.publish-needed.outputs.needed == 'true'
        env:
          TARGET_WEEK: ${{ steps.publish-needed.outputs.week }}
        run: echo "OVERSIZE_TARGET_WEEK=$TARGET_WEEK" >> "$GITHUB_ENV"

      - name: Determine dry-run mode
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        id: dry-run-mode
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-flight - check publication credentials
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAJC_WEEKLY_PR_TOKEN: ${{ secrets.DAJC_WEEKLY_PR_TOKEN }}
          DRY_RUN: ${{ steps.dry-run-mode.outputs.dry_run }}
        run: |
          if [ -z "$PERPLEXITY_API_KEY" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::PERPLEXITY_API_KEY (research) and ANTHROPIC_API_KEY (classification and writing) are both required. No article will be generated."
            exit 1
          fi
          if [ "$DAJC_AUTONOMOUS_WEEKLY" = "1" ] && [ "$DRY_RUN" != "true" ] && [ "$OVERSIZE_PREVIEW" != "1" ] && [ -z "$DAJC_WEEKLY_PR_TOKEN" ]; then
            echo "::error::DAJC_WEEKLY_PR_TOKEN missing: unattended content PR CI cannot be guaranteed. No paid research or publication attempted."
            exit 1
          fi
          echo "Required credentials present (values never printed)."

      - name: Setup Node
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        run: npm ci

      - name: Load latest monitoring data
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        run: node scripts/automation-data.mjs load findings

      - name: Final data refresh
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CLASSIFIER_MODEL: ${{ vars.CLAUDE_CLASSIFIER_MODEL || 'claude-haiku-5-5' }}
          # Scheduled retries reuse findings from a run in the last 18 h
          # instead of paying for the same search again (Thursday retries,
          # Friday recoveries). A manual force_refresh can request new evidence.
          OVERSIZE_REFRESH_MAX_AGE_HOURS: ${{ inputs.force_refresh && '0' || '18' }}
        run: npm run oversize:monitor

      - name: Persist source refresh before editorial preparation
        if: steps.publish-needed.outputs.needed == 'true' && steps.dry-run-mode.outputs.dry_run != 'true'
        run: node scripts/automation-data.mjs save findings

      - name: Check source preparation deduplication
        if: steps.publish-needed.outputs.needed == 'true'
        run: node scripts/check-weekly-preparation.mjs

      - name: Generate weekly article
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true'
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-sonnet-5-5' }}
        # One generation attempt. Quality > count: an edition contains exactly
        # the items that pass every editorial rule, so there is nothing to
        # retry for (no lead/Rest-of-Europe minimum, no padding loop).
        # Simulation writes only into this disposable runner so that the final
        # independent reviewer sees the exact bytes. All push/PR steps stay off.
        run: node scripts/generate-weekly-article.mjs ${{ steps.trigger.outputs.preview == 'true' && '--preview' || '' }} ${{ github.event.inputs.correction == 'true' && '--correction' || '' }}

      # Every final article requires independent approval, including simulations
      # and corrections.
      # A veto must not lose the audit; rejected content stays off public routes.
      - name: Claude final editorial approval for autonomous release
        id: review
        continue-on-error: true
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true' && steps.trigger.outputs.preview != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-sonnet-5-5' }}
        run: |
          target="${{ steps.publish-needed.outputs.target }}"
          if [ -f "$target" ]; then
            node scripts/claude-weekly-review.mjs "$target"
          else
            echo "::warning::No qualified article generated this week; no approval or publication."
          fi

      # A rejected edition may receive at most two source-safe repairs that
      # excludes ONLY URLs the reviewer marked unsupported. All deterministic
      # gates, live-source verification, build and independent review repeat.
      - name: Bounded source-safe regeneration after structured Claude veto
        id: recovery
        continue-on-error: true
        if: steps.review.outcome == 'failure' && steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true' && steps.trigger.outputs.preview != 'true'
        timeout-minutes: 25
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-sonnet-5-5' }}
        run: node scripts/recover-weekly-after-veto.mjs "${{ steps.publish-needed.outputs.target }}"

      - name: Open reviewed publication PR or persist data-only refresh
        id: gate
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true' && steps.dry-run-mode.outputs.dry_run != 'true'
        env:
          # Optional owner fine-grained token (this repository only; Contents:
          # read, Pull requests: read and write). A PR it opens runs its CI at
          # once; a PR opened by github-actions[bot] waits for workflow approval.
          DAJC_WEEKLY_PR_TOKEN: ${{ secrets.DAJC_WEEKLY_PR_TOKEN }}
          OVERSIZE_REPLACES_PR: ${{ steps.publish-needed.outputs.replaces_pr }}
        run: node scripts/publish-gate-commit.mjs

      # Autonomous release of a Claude-approved final edition: merge within
      # the main ruleset (no bypass) as soon as it allows it. The ruleset
      # counts only the PR's pull_request CI, which GitHub holds for approval
      # on a PR opened by github-actions[bot] (W45, 29 October 2026), so an
      # unattended release needs the PR opened with DAJC_WEEKLY_PR_TOKEN.
      # The article is public from its Friday 12:00 Europe/Prague slot. A
      # failed check leaves the PR for a human.
      - name: Release the approved edition after required checks
        if: steps.gate.outputs.auto_merge == 'true'
        timeout-minutes: 30
        env:
          PR_URL: ${{ steps.gate.outputs.pr_url }}
          EXPECTED_PR_HEAD: ${{ steps.gate.outputs.pr_head }}
          UNATTENDED: ${{ steps.gate.outputs.unattended }}
        run: node scripts/merge-reviewed-weekly.mjs

      - name: Verify production deployment and public release
        if: steps.gate.outputs.auto_merge == 'true' && steps.gate.outputs.unattended == 'true'
        timeout-minutes: 12
        env:
          TARGET_WEEK: ${{ steps.publish-needed.outputs.week }}
        run: |
          git fetch origin main
          git checkout --detach origin/main
          node scripts/verify-weekly-publication.mjs

      - name: Alert when Claude withheld the release
        if: steps.review.outcome == 'failure' && steps.recovery.outcome != 'success'
        run: |
          echo "::error::Claude did not approve this edition (see the review step). It waits for human review: ${{ steps.gate.outputs.pr_url || 'no PR was opened' }}"
          exit 1

      # A week where nothing qualifies exits the generator with success, so
      # without this step a missing edition would stay silent. Thursday runs
      # only warn (later retries refresh the data and try again); from the
      # Friday-early retry on - and on manual runs - a still-missing edition
      # fails the run so GitHub e-mails the owner before the 12:00 release.
      - name: Alert when no edition was produced
        if: steps.trigger.outputs.should_run == 'true' && steps.publish-needed.outputs.needed == 'true' && steps.trigger.outputs.preview != 'true'
        shell: bash
        run: |
          target="${{ steps.publish-needed.outputs.target }}"
          if [ -f "$target" ]; then
            echo "Edition present: $target"
            exit 0
          fi
          msg="No EU Oversize Weekly edition for ${{ steps.publish-needed.outputs.week }}: nothing passed the editorial rules (see the generator log above)."
          case "${{ steps.trigger.outputs.role }}" in
            thursday-*) echo "::warning::$msg Later retries will try again with refreshed data." ;;
            *) echo "::error::$msg"; exit 1 ;;
          esac

      - name: Archive editorial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-editorial-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dajc-weekly-*.json
            ${{ runner.temp }}/dajc-weekly-recovery/
            data/oversize/*/publication/
          if-no-files-found: ignore
          retention-days: 90

      - name: Report blocked publication
        if: failure()
        env:
          TARGET_WEEK: ${{ steps.publish-needed.outputs.week }}
        run: node scripts/report-weekly-failure.mjs

      - name: Publication outcome
        if: always()
        run: |
          echo "Trigger role: ${{ steps.trigger.outputs.role || 'unknown' }}"
          echo "Preview: ${{ steps.trigger.outputs.preview || 'false' }}"
          if [ "${{ steps.trigger.outputs.should_run }}" != "true" ]; then
            echo "Outcome: intentional no-op."
          elif [ "${{ steps.publish-needed.outputs.needed }}" = "false" ]; then
            echo "Outcome: article already exists or its PR awaits review; no generation repeated."
          elif [ "${{ job.status }}" = "success" ]; then
            echo "Outcome: preparation completed. Claude-approved final article can auto-merge only through protected GitHub CI."
          else
            echo "Outcome: publication pipeline failed; inspect the failed step above."
          fi
