name: Application CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'config/**'
      - 'data/driving-bans/**'
      - 'tests/**'
      - 'scripts/*driving-bans.mjs'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/application-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Driving Bans scoped lint
        run: npm run lint:driving-bans

      - name: Export canonical Driving Bans evidence
        run: npm run driving-bans:audit

      - name: Typecheck Astro and TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Upload Driving Bans evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driving-bans-evidence-${{ github.sha }}
          path: artifacts/driving-bans/
          if-no-files-found: warn
          retention-days: 14
