name: Publish approved DAJC News to LinkedIn (temporary personal profile)

# Temporary owner-approved personal profile through Buffer only.
# On by owner decision (24 October 2026), via Buffer; set the repository
# variable DAJC_LINKEDIN_ENABLED=false to stop all live runs. No company-page fallback.
on:
  push:
    branches: [main]
    paths:
      - 'src/content/news/platform/**'
      - 'src/content/news/eu-oversize/**'
  schedule:
    - cron: '37 13 * * *'
      timezone: 'Europe/Prague'
    - cron: '43 18 * * *'
      timezone: 'Europe/Prague'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview copy without API calls, costs or ledger writes'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: dajc-linkedin-publications
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.DAJC_LINKEDIN_ENABLED != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DAJC_CLAUDE_SOCIAL_ENABLED: ${{ vars.DAJC_CLAUDE_SOCIAL_ENABLED || 'true' }}
      DAJC_LINKEDIN_TARGET: personal
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preview LinkedIn teaser
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: node scripts/publish-social-news.mjs linkedin --dry-run
      - name: Require explicit LinkedIn publishing activation
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && vars.DAJC_LINKEDIN_ENABLED == 'false'
        run: |
          echo '::error::LinkedIn publication is switched off (DAJC_LINKEDIN_ENABLED=false); remove the variable or set it to true to publish.'
          exit 1
      - name: Load LinkedIn publication state
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        run: node scripts/automation-data.mjs load linkedin
      - name: Verify publicly approved news and reserve post
        id: reserve
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        env:
          DAJC_SOCIAL_BACKEND: buffer
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_SOCIAL_MODEL: ${{ vars.CLAUDE_SOCIAL_MODEL || 'claude-sonnet-5-5' }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          DAJC_BUFFER_LINKEDIN_CHANNEL_ID: ${{ vars.DAJC_BUFFER_LINKEDIN_CHANNEL_ID || '6adc3c32778b240e2fa9f0bc' }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          DAJC_LINKEDIN_ORGANIZATION_URN: ${{ vars.DAJC_LINKEDIN_ORGANIZATION_URN }}
        run: node scripts/publish-social-news.mjs linkedin --prepare
      - name: Persist reservation before LinkedIn API call
        if: steps.reserve.outputs.send == 'true'
        run: node scripts/automation-data.mjs save linkedin
      - name: Publish only from approved temporary personal LinkedIn profile
        if: steps.reserve.outputs.send == 'true'
        env:
          DAJC_SOCIAL_BACKEND: buffer
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          DAJC_BUFFER_LINKEDIN_CHANNEL_ID: ${{ vars.DAJC_BUFFER_LINKEDIN_CHANNEL_ID || '6adc3c32778b240e2fa9f0bc' }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          DAJC_LINKEDIN_ORGANIZATION_URN: ${{ vars.DAJC_LINKEDIN_ORGANIZATION_URN }}
        run: node scripts/publish-social-news.mjs linkedin --publish
      - name: Persist confirmed LinkedIn post
        if: steps.reserve.outputs.send == 'true'
        run: node scripts/automation-data.mjs save linkedin
