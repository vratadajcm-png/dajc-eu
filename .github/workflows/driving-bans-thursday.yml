name: Driving Bans Thursday gate

# Thursday-only full-registry technical gate for the canonical Driving Bans dataset.
# The semantic legal re-verification is performed by the scheduled DAJC HGV
# sweep (see docs/DRIVING_BANS_CANONICAL.md), which updates
# data/driving-bans/canonical.json. This workflow never fetches or interprets
# law; it fails when the reviewed span no longer contains the active
# current+next calendar month, or when the last sweep is older than 8 days, so
# a missed Thursday sweep is visible instead of silently decaying to UNKNOWN.
# The exported verification-plan.json supplies official web source seeds and
# the central KZ/RU/TR motorway/main-road scope to the semantic reviewer.
# Targeted source checks do not count as a fresh full-registry sweep.

on:
  schedule:
    # Thursday 09:17 UTC (10:17 CET / 11:17 CEST), after the sweep window.
    - cron: '17 9 * * 4'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: driving-bans-thursday
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Driving Bans scoped lint
        run: npm run lint:driving-bans

      - name: Driving Bans tests
        run: npx vitest run src/lib/driving-bans

      - name: Export full-registry evidence and enforce sweep freshness
        run: npm run driving-bans:audit -- --mode full --max-sweep-age-days 8

      # AI research of official sources: drafts and a run report in the artifact only.
      # Off unless the repository variable DAJC_DRIVING_BANS_RESEARCH_ENABLED is "true";
      # it then also needs both budgets and two configured vendors (docs/DRIVING_BANS_RESEARCH.md).
      # It never writes canonical.json, never approves and never publishes; a technically
      # successful run is not a legal verification. Runs even when the freshness gate fails.
      - name: AI research of official sources (drafts only)
        if: ${{ !cancelled() && vars.DAJC_DRIVING_BANS_RESEARCH_ENABLED == 'true' }}
        env:
          DAJC_DRIVING_BANS_RESEARCH_ENABLED: 'true'
          DAJC_RESEARCH_RUN_BUDGET_USD: ${{ vars.DAJC_RESEARCH_RUN_BUDGET_USD }}
          DAJC_RESEARCH_MONTHLY_BUDGET_USD: ${{ vars.DAJC_RESEARCH_MONTHLY_BUDGET_USD }}
          DAJC_RESEARCH_MAX_REQUESTS_PER_RUN: ${{ vars.DAJC_RESEARCH_MAX_REQUESTS_PER_RUN }}
          DAJC_RESEARCH_PRICING_USD: ${{ vars.DAJC_RESEARCH_PRICING_USD }}
          DAJC_RESEARCH_ROUTE_DISCOVER: ${{ vars.DAJC_RESEARCH_ROUTE_DISCOVER }}
          DAJC_RESEARCH_ROUTE_EXTRACT: ${{ vars.DAJC_RESEARCH_ROUTE_EXTRACT }}
          DAJC_RESEARCH_ROUTE_VERIFY: ${{ vars.DAJC_RESEARCH_ROUTE_VERIFY }}
          DAJC_RESEARCH_ANTHROPIC_MODEL: ${{ vars.DAJC_RESEARCH_ANTHROPIC_MODEL }}
          DAJC_RESEARCH_OPENAI_MODEL: ${{ vars.DAJC_RESEARCH_OPENAI_MODEL }}
          DAJC_RESEARCH_XAI_MODEL: ${{ vars.DAJC_RESEARCH_XAI_MODEL }}
          DAJC_RESEARCH_GEMINI_MODEL: ${{ vars.DAJC_RESEARCH_GEMINI_MODEL }}
          DAJC_RESEARCH_MISTRAL_MODEL: ${{ vars.DAJC_RESEARCH_MISTRAL_MODEL }}
          DAJC_RESEARCH_ANTHROPIC_API_KEY: ${{ secrets.DAJC_RESEARCH_ANTHROPIC_API_KEY }}
          DAJC_RESEARCH_OPENAI_API_KEY: ${{ secrets.DAJC_RESEARCH_OPENAI_API_KEY }}
          DAJC_RESEARCH_XAI_API_KEY: ${{ secrets.DAJC_RESEARCH_XAI_API_KEY }}
          DAJC_RESEARCH_GEMINI_API_KEY: ${{ secrets.DAJC_RESEARCH_GEMINI_API_KEY }}
          DAJC_RESEARCH_MISTRAL_API_KEY: ${{ secrets.DAJC_RESEARCH_MISTRAL_API_KEY }}
          DAJC_RESEARCH_PERPLEXITY_API_KEY: ${{ secrets.DAJC_RESEARCH_PERPLEXITY_API_KEY }}
        run: npm run driving-bans:research -- run --mode full --store artifacts/driving-bans/research ${{ github.event_name == 'workflow_dispatch' && '--initial-repair' || '' }}

      - name: Upload Driving Bans evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driving-bans-thursday-${{ github.run_id }}
          path: artifacts/driving-bans/
          if-no-files-found: warn
          retention-days: 90
