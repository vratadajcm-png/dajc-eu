name: Driving Bans Thursday gate

# Thursday-only full-registry technical gate for the canonical Driving Bans dataset.
# The semantic legal re-verification is performed by the scheduled DAJC HGV
# sweep (see docs/DRIVING_BANS_CANONICAL.md), which updates
# data/driving-bans/canonical.json. This workflow never fetches or interprets
# law; it fails when the reviewed span no longer contains the active
# rolling 12-month planning horizon, or when the last sweep is older than 8 days, so
# a missed Thursday sweep is visible instead of silently decaying to UNKNOWN.
# The exported verification-plan.json supplies official web source seeds and
# the central KZ/RU/TR motorway/main-road scope to the semantic reviewer.
# The annual view can include unpublished future legal periods; incomplete legal
# coverage must remain visible, never be presented as an empty/NO_BAN calendar.
# Targeted source checks do not count as a fresh full-registry sweep.

on:
  schedule:
    # Thursday 09:17 UTC (10:17 CET / 11:17 CEST), after the sweep window.
    - cron: '17 9 * * 4'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: driving-bans-thursday
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Driving Bans scoped lint
        run: npm run lint:driving-bans

      - name: Driving Bans tests
        run: npx vitest run src/lib/driving-bans

      - name: Export full-registry evidence and enforce sweep freshness
        # Also fails while a rule approved automatically from a PDF is past its 7-day human review.
        run: npm run driving-bans:audit -- --mode full --max-sweep-age-days 8 --fail-on-overdue-auto-review

      # AI research of official sources: drafts and a run report in the artifact only.
      # Off unless the repository variable DAJC_DRIVING_BANS_RESEARCH_ENABLED is "true";
      # it then also needs both budgets and two configured vendors (docs/DRIVING_BANS_RESEARCH.md).
      # It never writes canonical.json, never approves and never publishes; a technically
      # successful run is not a legal verification. Runs even when the freshness gate fails.
      - name: AI research of official sources (drafts only)
        if: ${{ !cancelled() && vars.DAJC_DRIVING_BANS_RESEARCH_ENABLED == 'true' }}
        env:
          DAJC_DRIVING_BANS_RESEARCH_ENABLED: 'true'
          DAJC_RESEARCH_RUN_BUDGET_USD: ${{ vars.DAJC_RESEARCH_RUN_BUDGET_USD }}
          DAJC_RESEARCH_MONTHLY_BUDGET_USD: ${{ vars.DAJC_RESEARCH_MONTHLY_BUDGET_USD }}
          DAJC_RESEARCH_MAX_REQUESTS_PER_RUN: ${{ vars.DAJC_RESEARCH_MAX_REQUESTS_PER_RUN }}
          DAJC_RESEARCH_PRICING_USD: ${{ vars.DAJC_RESEARCH_PRICING_USD }}
          DAJC_RESEARCH_ROUTE_DISCOVER: ${{ vars.DAJC_RESEARCH_ROUTE_DISCOVER }}
          DAJC_RESEARCH_ROUTE_EXTRACT: ${{ vars.DAJC_RESEARCH_ROUTE_EXTRACT }}
          DAJC_RESEARCH_ROUTE_VERIFY: ${{ vars.DAJC_RESEARCH_ROUTE_VERIFY }}
          DAJC_RESEARCH_ANTHROPIC_MODEL: ${{ vars.DAJC_RESEARCH_ANTHROPIC_MODEL }}
          DAJC_RESEARCH_OPENAI_MODEL: ${{ vars.DAJC_RESEARCH_OPENAI_MODEL }}
          DAJC_RESEARCH_XAI_MODEL: ${{ vars.DAJC_RESEARCH_XAI_MODEL }}
          DAJC_RESEARCH_GEMINI_MODEL: ${{ vars.DAJC_RESEARCH_GEMINI_MODEL }}
          DAJC_RESEARCH_MISTRAL_MODEL: ${{ vars.DAJC_RESEARCH_MISTRAL_MODEL }}
          DAJC_RESEARCH_ANTHROPIC_API_KEY: ${{ secrets.DAJC_RESEARCH_ANTHROPIC_API_KEY }}
          DAJC_RESEARCH_OPENAI_API_KEY: ${{ secrets.DAJC_RESEARCH_OPENAI_API_KEY }}
          DAJC_RESEARCH_XAI_API_KEY: ${{ secrets.DAJC_RESEARCH_XAI_API_KEY }}
          DAJC_RESEARCH_GEMINI_API_KEY: ${{ secrets.DAJC_RESEARCH_GEMINI_API_KEY }}
          DAJC_RESEARCH_MISTRAL_API_KEY: ${{ secrets.DAJC_RESEARCH_MISTRAL_API_KEY }}
          DAJC_RESEARCH_PERPLEXITY_API_KEY: ${{ secrets.DAJC_RESEARCH_PERPLEXITY_API_KEY }}
        run: npm run driving-bans:research -- run --mode full --store artifacts/driving-bans/research ${{ github.event_name == 'workflow_dispatch' && '--initial-repair' || '' }}

      - name: Upload Driving Bans evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driving-bans-thursday-${{ github.run_id }}
          path: artifacts/driving-bans/
          if-no-files-found: warn
          retention-days: 90

  # Automatic approval of research drafts from official PDF documents (owner decision,
  # 3 November 2026). Off unless the repository variable DAJC_DRIVING_BANS_AUTO_APPROVAL_ENABLED
  # is "true" (and research is on). Code decides, not a model: only new dates of a ban a
  # person verified, from a PDF with a text layer on an official host, with two vendors
  # agreeing and every quote found on its page (src/lib/driving-bans/research/auto-approve.mjs).
  # Approved rules are labelled "verified automatically", need a human review within 7 days
  # and never change coverage, reviewed periods or NO_BAN. Publication is a pull request into
  # main through the required CI; it merges itself only when the PR was opened with the owner's
  # token and DAJC_DRIVING_BANS_AUTO_MERGE is not "false" (as for the Weekly, docs/MAIN_PROTECTION.md).
  auto-approve:
    needs: gate
    if: ${{ !cancelled() && vars.DAJC_DRIVING_BANS_RESEARCH_ENABLED == 'true' && vars.DAJC_DRIVING_BANS_AUTO_APPROVAL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the research drafts of this run
        uses: actions/download-artifact@v4
        with:
          name: driving-bans-thursday-${{ github.run_id }}
          path: artifacts/driving-bans/

      - name: Decide the PDF drafts (code gate)
        id: approve
        env:
          DAJC_DRIVING_BANS_AUTO_APPROVAL_ENABLED: 'true'
        run: |
          mkdir -p artifacts/driving-bans/auto-approval
          npm run --silent driving-bans:research -- auto-approve --store artifacts/driving-bans/research --evidence-store data/driving-bans/staging \
            --candidate-out artifacts/driving-bans/auto-approval/canonical.candidate.json --report-md artifacts/driving-bans/auto-approval/report.md \
            > artifacts/driving-bans/auto-approval/result.json
          approved=$(node -e "console.log(JSON.parse(require('fs').readFileSync('artifacts/driving-bans/auto-approval/result.json','utf8')).approved)")
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
          cat artifacts/driving-bans/auto-approval/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open the publication pull request
        id: pr
        if: steps.approve.outputs.approved != '0'
        env:
          # The owner's fine-grained token (this repository; Contents read, Pull requests write) opens
          # the PR so that its required CI starts at once; pushes use the job token.
          GH_TOKEN: ${{ secrets.DAJC_DRIVING_BANS_PR_TOKEN || secrets.DAJC_WEEKLY_PR_TOKEN || github.token }}
          UNATTENDED: ${{ (secrets.DAJC_DRIVING_BANS_PR_TOKEN != '' || secrets.DAJC_WEEKLY_PR_TOKEN != '') && 'true' || 'false' }}
        run: |
          cp artifacts/driving-bans/auto-approval/canonical.candidate.json data/driving-bans/canonical.json
          npm run lint:driving-bans
          npm run typecheck
          npm test
          npm run build
          npm run driving-bans:audit -- --mode validate
          branch="automation/driving-bans-auto-${{ github.run_id }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add data/driving-bans/canonical.json data/driving-bans/staging
          git commit -m "Driving Bans: automatic approval from official PDF documents (gate dba-1)"
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "Driving Bans: ověřeno automaticky z úředních PDF ($(date -u +%F))" --body-file artifacts/driving-bans/auto-approval/report.md)
          echo "pr_url=$url" >> "$GITHUB_OUTPUT"
          echo "unattended=$UNATTENDED" >> "$GITHUB_OUTPUT"

      - name: Merge after the required checks
        if: steps.pr.outputs.pr_url != '' && vars.DAJC_DRIVING_BANS_AUTO_MERGE != 'false'
        timeout-minutes: 30
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          UNATTENDED: ${{ steps.pr.outputs.unattended }}
        run: |
          if [ "$UNATTENDED" != "true" ]; then
            echo "::error::The automatic approval is ready, but GitHub holds the CI of a PR opened by github-actions[bot]. Approve the pending workflows on $PR_URL and merge it, or add the DAJC_DRIVING_BANS_PR_TOKEN secret."
            exit 1
          fi
          for attempt in $(seq 1 50); do
            if result=$(gh pr merge "$PR_URL" --squash 2>&1); then
              echo "$result"
              echo "$PR_URL merged after required checks." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: not mergeable yet: $(printf '%s' "$result" | tr '\n' ' ' | cut -c1-300)"
            failed=$(gh pr checks "$PR_URL" --required --json bucket \
              --jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' 2>/dev/null || true)
            if [ "${failed:-0}" != "0" ]; then
              echo "::error::A required check failed; the automatic approval waits for a person: $PR_URL"
              exit 1
            fi
            sleep 30
          done
          echo "::error::The ruleset did not allow the merge within 25 minutes; the automatic approval waits for a person: $PR_URL"
          exit 1

      - name: Upload the automatic approval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driving-bans-auto-approval-${{ github.run_id }}
          path: artifacts/driving-bans/auto-approval/
          if-no-files-found: ignore
          retention-days: 90
