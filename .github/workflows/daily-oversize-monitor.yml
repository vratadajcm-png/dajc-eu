name: Daily Oversize Monitor

# Runs on Monday and Wednesday mornings (Europe-time, see
# docs/NEWS_AUTOMATION.md for the exact UTC/DST reasoning). Each run searches
# the last 7 days, so two runs plus Thursday's final refresh cover the week at
# the lowest cost. Discovers news by web search (scripts/lib/web-search.mjs)
# and writes whatever it verifies to data/oversize/<ISO week>/findings.json. Never touches
# content/news - this only maintains the raw dataset the Friday publish
# workflow reads from.
#
# Findings persist on automation/oversize-data. Only JSON files from that
# branch are loaded; executable code always comes from main. No main bypass.

on:
  schedule:
    # 06:00 UTC = 07:00 CET / 08:00 CEST - close enough to "morning Europe"
    # without needing DST-aware cron math for a run that isn't time-critical
    # (unlike the Friday publish window, see publish-weekly-oversize.yml).
    - cron: '0 6 * * 1,3'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: oversize-data
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Load latest monitoring data
        run: node scripts/automation-data.mjs load findings

      - name: Pre-flight - verify Perplexity and Claude keys are configured
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$PERPLEXITY_API_KEY" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::PERPLEXITY_API_KEY and ANTHROPIC_API_KEY are both required for web discovery."
            exit 1
          fi
          echo "Pre-flight OK: research credentials are present."

      - name: Run oversize monitor (web search)
        # Perplexity Search ($5 per 1,000 requests) with Claude Haiku
        # classification - the lowest-cost path. OpenAI is not used.
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CLASSIFIER_MODEL: ${{ vars.CLAUDE_CLASSIFIER_MODEL || 'claude-haiku-5-5' }}
        run: npm run oversize:monitor

      - name: Commit updated findings (only if meaningfully changed)
        run: |
          git config user.name "dajc-bot"
          git config user.email "bot@users.noreply.github.com"

          # Security boundary: this automation is allowed to change raw oversize
          # monitoring data only. Any source-code/config/workflow change aborts
          # the job before staging or pushing anything.
          unexpected="$(git status --porcelain --untracked-files=all | cut -c4- | grep -Ev '^data/oversize/' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Oversize monitor modified files outside data/oversize/**"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          node scripts/automation-data.mjs save findings
