name: One-time DAJC provider smoke test (no publication)

on:
  push:
    branches:
      - test/weekly-provider-smoke-20261024
    paths:
      - .github/workflows/test-weekly-providers-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-time-dajc-weekly-provider-smoke
  cancel-in-progress: false

jobs:
  check-apis:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Diagnose secret visibility (names only, no values)
        env:
          CHECK_PERPLEXITY: ${{ secrets.PERPLEXITY_API_KEY != '' }}
          CHECK_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          CHECK_CLAUDE_ALIAS: ${{ secrets.CLAUDE_API_KEY != '' }}
          CHECK_PERPLEXITY_ALIAS: ${{ secrets.PERPLEXITY_KEY != '' }}
          CHECK_BUFFER: ${{ secrets.BUFFER_API_KEY != '' }}
          CHECK_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          echo "Expected Perplexity secret visible: $CHECK_PERPLEXITY"
          echo "Expected Anthropic secret visible: $CHECK_ANTHROPIC"
          echo "Possible Claude alias visible: $CHECK_CLAUDE_ALIAS"
          echo "Possible Perplexity alias visible: $CHECK_PERPLEXITY_ALIAS"
          echo "Buffer secret visible: $CHECK_BUFFER"
          echo "Existing OpenAI secret visible: $CHECK_OPENAI"
      - name: Test Perplexity Search API only (no publication)
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_SEARCH_MODEL: ${{ vars.PERPLEXITY_SEARCH_MODEL }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
        run: python3 scripts/smoke-weekly-providers.py --test-search
